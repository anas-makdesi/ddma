name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: compiled kernel was built
        run: python -c "import ddma, sys; sys.exit(0 if ddma.compiled_backend_available() else 1)"
      - run: ruff check .
      - run: pytest -q
      - run: MPLBACKEND=Agg python examples/scalar_map.py && MPLBACKEND=Agg python examples/adaptive_cruise_control.py && python examples/lazy_synthesis.py 30

  matlab-octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave octave-dev
      - name: build MEX and run the MATLAB tests (against Python reference results)
        working-directory: matlab
        run: octave --no-gui --eval "build_mex; addpath tests; run_tests; run examples/acc_safety_filter; clear; run examples/pendulum_bounded_derivatives; clear; run examples/online_refinement; clear; run examples/scalar_map; clear; run examples/bounded_derivative_map; clear; K = 20; run examples/lazy_synthesis"
