name: CI
on:
  push:
  pull_request:
  workflow_dispatch:  # manual run; also runs the macOS job below
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: compiled kernel was built
        run: python -c "import ddma, sys; sys.exit(0 if ddma.compiled_backend_available() else 1)"
      - run: ruff check .
      - run: pytest -q
      - run: MPLBACKEND=Agg python examples/scalar_map.py && MPLBACKEND=Agg python examples/adaptive_cruise_control.py && python examples/lazy_synthesis.py 30
      - name: assumption monitor (example)
        run: python examples/assumption_monitor.py 50000 --no-plot
      - name: gridless safe envelopes (examples)
        run: MPLBACKEND=Agg python examples/envelope_room_cooling.py 300 && MPLBACKEND=Agg python examples/envelope_nonlinear.py

  python-no-openmp:
    # the kernel must also build and give the same results without OpenMP (e.g. Apple clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: DDMA_NO_OPENMP=1 pip install -e ".[dev]"
      - run: python -c "import ddma.threads as t, sys; sys.exit(0 if not t.openmp_available() and t.get_num_threads() == 1 else 1)"
      - run: pytest -q tests/test_threads.py tests/test_partitioned.py tests/test_growth_cpp.py tests/test_bd_methods.py

  other-os:
    # macOS (Apple's compiler + Homebrew's libomp) and Windows (Microsoft's compiler).
    # Run on demand only (Actions tab -> CI -> Run workflow): macOS minutes count 10x and
    # Windows minutes 2x on private repositories.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: pip install -e ".[dev]"
      - run: python -c "import ddma.threads as t, sys; print(t.openmp_available(), t.get_num_threads()); sys.exit(0 if t.openmp_available() else 1)"
      - run: pytest -q tests/test_threads.py tests/test_partitioned.py tests/test_growth_cpp.py tests/test_bd_methods.py
      - run: python benchmarks/kernels.py --repeat 2

  matlab-octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave octave-dev
      - name: build MEX and run the MATLAB tests (against Python reference results)
        working-directory: matlab
        run: octave --no-gui --eval "build_mex; addpath tests; run_tests; run_threads_tests; run_abstraction_tests; run_monitor_tests; run examples/acc_safety_filter; clear; run examples/assumption_monitor; clear; run examples/pendulum_bounded_derivatives; clear; run examples/online_refinement; clear; run examples/scalar_map; clear; run examples/bounded_derivative_map; clear; K = 20; run examples/lazy_synthesis; clear; run examples/rl_safety_filter"
      - name: gridless safe envelopes (MATLAB tests against Python, examples)
        working-directory: matlab
        run: octave --no-gui --eval "addpath tests; run_invariance_tests; run examples/envelope_room_cooling; clear; run examples/envelope_nonlinear"
