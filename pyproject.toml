[build-system]
requires = ["setuptools>=77", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "ddma"
version = "0.12.0"
description = "Data-driven models and abstractions with guarantees: models of monotone systems and systems with bounded derivatives, symbolic abstractions and correct-by-construction controllers from data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Anas Makdesi" },
  { name = "Antoine Girard" },
  { name = "Laurent Fribourg" },
  { name = "Majid Zamani" },
  { name = "Saber Jafarpour" },
]
keywords = ["control", "monotone systems", "data-driven control", "abstraction", "formal methods", "safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.22"]

[project.urls]
Documentation = "https://anas-makdesi.github.io/ddma/"
Source = "https://github.com/anas-makdesi/ddma"
Changelog = "https://github.com/anas-makdesi/ddma/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
examples = ["matplotlib>=3.5", "scipy>=1.9"]
lp = ["scipy>=1.9"]
rl = ["gymnasium>=0.29"]
rl-demo = ["gymnasium>=0.29", "stable-baselines3>=2.0", "matplotlib>=3.5"]
docs = [
  "sphinx>=7", "furo", "myst-nb>=1.1", "sphinx-design", "sphinx-copybutton",
  "jupytext", "ipykernel",
  "matplotlib>=3.5", "scipy>=1.9", "gymnasium>=0.29",
]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.5", "scipy>=1.9", "gymnasium>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# zip(strict=) exists from Python 3.10; adding it everywhere would change behaviour (B905)
ignore = ["B905"]

# Pre-built wheels (.github/workflows/packages.yml). Every wheel is installed on its own
# and must have the compiled kernels *with* OpenMP, then the whole test suite runs on it.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*t-* *-musllinux_*"  # not yet: free-threaded Python, musl Linux (Alpine)
test-extras = ["dev"]
test-command = [
  "python {project}/.github/scripts/check_wheel.py",
  "pytest -q -p no:cacheprovider {project}/tests",
]

[tool.cibuildwheel.macos]
# Apple's compiler needs Homebrew's libomp (installed by the workflow); delocate copies it
# into the wheel, so users need neither Homebrew nor libomp.
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
# Microsoft's OpenMP runtime (vcomp140.dll) is not part of Python: copy it into the wheel.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-dll vcomp140.dll -w {dest_dir} {wheel}"
