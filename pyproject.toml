[build-system]
requires = ["setuptools>=64", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "ddma"
version = "0.12.0"
description = "Data-driven models and abstractions with guarantees: models of monotone systems and systems with bounded derivatives, symbolic abstractions and correct-by-construction controllers from data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Anas Makdesi" },
  { name = "Antoine Girard" },
  { name = "Laurent Fribourg" },
  { name = "Majid Zamani" },
  { name = "Saber Jafarpour" },
]
keywords = ["control", "monotone systems", "data-driven control", "abstraction", "formal methods", "safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
examples = ["matplotlib>=3.5", "scipy>=1.9"]
lp = ["scipy>=1.9"]
rl = ["gymnasium>=0.29"]
rl-demo = ["gymnasium>=0.29", "stable-baselines3>=2.0", "matplotlib>=3.5"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.5", "scipy>=1.9", "gymnasium>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
